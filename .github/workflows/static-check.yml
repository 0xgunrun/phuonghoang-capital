name: static-check
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: mask legacy key
        run: echo "::add-mask::$LEGACY_API_KEY"
        env:
          LEGACY_API_KEY: ${{ vars.LEGACY_API_KEY }}
      - name: env audit
        run: env | grep -E 'TOKEN|KEY|LEGACY' | sort
        env:
          LEGACY_API_KEY: ${{ vars.LEGACY_API_KEY }}
          DEPLOY_TOKEN: ${{ vars.DEPLOY_TOKEN }}
